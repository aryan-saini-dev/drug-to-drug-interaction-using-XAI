services:
  - type: web
    name: ddi-xai-backend
    runtime: python
    plan: starter          # Use 'free' if you want free tier (512 MB RAM limit)
    region: oregon         # Change to 'frankfurt' etc. if preferred
    buildCommand: bash render-build.sh
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # You will paste this manually in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PYTHON_VERSION
        value: "3.12"
